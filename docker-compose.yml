# =============================================================================
# EBMC GROUP - Docker Compose
# Configuration pour NAS UGreen DXP4800 Plus
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ebmc-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ebmc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebmc-app
    restart: always
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ./public/images:/app/public/images:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_CLIENT_SECRET=${APPLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - BOOND_CLIENT_ID=${BOOND_CLIENT_ID:-}
      - BOOND_CLIENT_SECRET=${BOOND_CLIENT_SECRET:-}
      - BOOND_INSTANCE=${BOOND_INSTANCE:-}
      - BOOND_API_USER=${BOOND_API_USER:-}
      - BOOND_API_TOKEN=${BOOND_API_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - MAKE_WEBHOOK_CONTACT=${MAKE_WEBHOOK_CONTACT:-}
      - MAKE_WEBHOOK_CANDIDATE=${MAKE_WEBHOOK_CANDIDATE:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebmc-network

  # ---------------------------------------------------------------------------
  # Adminer (Database GUI) - Optionnel
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: ebmc-adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8180}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - ebmc-network

volumes:
  mysql_data:

networks:
  ebmc-network:
    driver: bridge
