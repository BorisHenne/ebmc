# =============================================================================
# EBMC GROUP - Docker Compose
# Configuration pour NAS UGreen DXP4800 Plus
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ebmc-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebmc}
      POSTGRES_USER: ${POSTGRES_USER:-ebmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebmc_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ebmc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebmc} -d ${POSTGRES_DB:-ebmc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebmc-app
    restart: always
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ebmc}:${POSTGRES_PASSWORD:-ebmc_secret}@db:5432/${POSTGRES_DB:-ebmc}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebmc-network

volumes:
  postgres_data:

networks:
  ebmc-network:
    driver: bridge
