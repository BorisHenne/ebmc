# =============================================================================
# EBMC GROUP - Docker Compose Production
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  db:
    # Désactiver le port externe en production
    ports: []
    # Logging limité
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      - NODE_ENV=production
    # Logging production
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Resources limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Désactiver Adminer en production
  adminer:
    profiles:
      - never

  # Activer Traefik en production
  traefik:
    profiles: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
